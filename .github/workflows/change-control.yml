name: Change Control Gates

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  approval-gate:
    if: ${{ vars.ENFORCE_CHANGE_CONTROL == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required approvers
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('No pull_request context');
              return;
            }

            // Required approver logins from repo variables
            const listVar = process.env.REQUIRED_APPROVERS || '';
            const list = listVar.split(',').map(s => s.trim()).filter(Boolean);
            const required = [
              ...list,
              process.env.RELEASE_MANAGER || '',
              process.env.SECURITY_REVIEWER || ''
            ].filter(Boolean);

            if (required.length === 0) {
              core.warning('No required approvers configured (RELEASE_MANAGER/SECURITY_REVIEWER). Skipping.');
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            // Last state per user
            const approvals = new Map();
            for (const r of reviews) {
              approvals.set(r.user.login.toLowerCase(), r.state);
            }

            const missing = [];
            for (const login of required) {
              const state = approvals.get(login.toLowerCase());
              if (state !== 'APPROVED') {
                missing.push(login);
              }
            }

            if (missing.length > 0) {
              core.setFailed(`Missing required approvals from: ${missing.join(', ')}`);
            } else {
              core.info('All required approvers have approved the PR.');
            }
        env:
          REQUIRED_APPROVERS: ${{ vars.REQUIRED_APPROVERS }}
          RELEASE_MANAGER: ${{ vars.RELEASE_MANAGER }}
          SECURITY_REVIEWER: ${{ vars.SECURITY_REVIEWER }}

      - name: Resolve evidence/signature paths
        id: paths
        shell: bash
        env:
          EVIDENCE_PATH: ${{ vars.CHANGE_EVIDENCE_PATH }}
          SIGNATURE_PATH: ${{ vars.CHANGE_SIGNATURE_PATH }}
        run: |
          EVIDENCE="${EVIDENCE_PATH:-.change-control/signed_change_approval.json}"
          SIG="${SIGNATURE_PATH:-${EVIDENCE}.sig}"
          echo "Using evidence: $EVIDENCE"
          echo "Using signature: $SIG"
          if [ ! -f "$EVIDENCE" ]; then
            echo "Evidence file not found: $EVIDENCE" >&2
            exit 1
          fi
          if [ ! -f "$SIG" ]; then
            echo "Signature file not found: $SIG" >&2
            exit 1
          fi
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          echo "SIG=$SIG" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Write cosign public key
        if: ${{ env.COSIGN_PUBLIC_KEY != '' }}
        shell: bash
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          if [ -z "$COSIGN_PUBLIC_KEY" ]; then
            echo "COSIGN_PUBLIC_KEY not set; skipping public key file generation."
            exit 0
          fi
          printf "%s" "$COSIGN_PUBLIC_KEY" > cosign.pub

      - name: Verify change approval signature
        shell: bash
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_CERT: ${{ secrets.COSIGN_CERT }}
          COSIGN_CERT_CHAIN: ${{ secrets.COSIGN_CERT_CHAIN }}
          COSIGN_CERT_IDENTITY: ${{ vars.COSIGN_CERT_IDENTITY }}
          COSIGN_CERT_ISSUER: ${{ vars.COSIGN_CERT_ISSUER }}
        run: |
          set -euo pipefail
          echo "Choosing cosign verification mode..."
          if [ -n "${COSIGN_KEY:-}" ]; then
            echo "Using KMS key: $COSIGN_KEY"
            cosign verify-blob --key "$COSIGN_KEY" --signature "$SIG" "$EVIDENCE"
            exit 0
          fi

          if [ -n "${COSIGN_PUBLIC_KEY:-}" ] && [ -f cosign.pub ]; then
            echo "Using static public key"
            cosign verify-blob --key cosign.pub --signature "$SIG" "$EVIDENCE"
            exit 0
          fi

          if [ -n "${COSIGN_CERT:-}" ] && [ -n "${COSIGN_CERT_CHAIN:-}" ]; then
            echo "Using keyless certificate verification"
            printf "%s" "$COSIGN_CERT" > cosign.crt
            printf "%s" "$COSIGN_CERT_CHAIN" > fulcio.crt
            EXTRA=()
            if [ -n "${COSIGN_CERT_IDENTITY:-}" ]; then
              EXTRA+=("--certificate-identity" "$COSIGN_CERT_IDENTITY")
            fi
            if [ -n "${COSIGN_CERT_ISSUER:-}" ]; then
              EXTRA+=("--certificate-oidc-issuer" "$COSIGN_CERT_ISSUER")
            fi
            cosign verify-blob --certificate cosign.crt --cert-chain fulcio.crt --signature "$SIG" "$EVIDENCE" "${EXTRA[@]}"
            exit 0
          fi

          echo "No cosign verification mode configured. Provide one of: COSIGN_KEY (KMS), COSIGN_PUBLIC_KEY (static), or COSIGN_CERT/COSIGN_CERT_CHAIN (keyless)." >&2
          exit 1
