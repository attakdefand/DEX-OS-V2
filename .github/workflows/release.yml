name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        shell: bash
        run: |
          cd DEX-OS-V2
          cargo build --release -p dex-core --bin riskctl --bin compliance_report
          cargo build --release -p dex-api
          mkdir -p artifacts
          cp target/release/riskctl artifacts/riskctl-${{ runner.os }}
          cp target/release/compliance_report artifacts/compliance_report-${{ runner.os }}
          cp target/release/dex-api artifacts/dex-api-${{ runner.os }}
        if: runner.os != 'Windows'

      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd DEX-OS-V2
          cargo build --release -p dex-core --bin riskctl --bin compliance_report
          cargo build --release -p dex-api
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target\release\riskctl.exe artifacts\riskctl-Windows.exe
          Copy-Item target\release\compliance_report.exe artifacts\compliance_report-Windows.exe
          Copy-Item target\release\dex-api.exe artifacts\dex-api-Windows.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}
          path: DEX-OS-V2/artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/dex-os:latest
            ghcr.io/${{ github.repository_owner }}/dex-os:${{ github.ref_name }}

      - name: Log in to Docker Hub
        if: secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (Docker Hub)
        if: secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            attakdefand/dex-os:latest
            attakdefand/dex-os:${{ github.ref_name }}
