version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/dex
      RUST_LOG: info
    ports:
      - "3030:3030"
    command: ["/usr/local/bin/dex-api"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3030/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
