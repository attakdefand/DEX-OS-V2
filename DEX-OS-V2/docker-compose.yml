version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dex
      POSTGRES_PASSWORD: dexpass
      POSTGRES_DB: dex_os
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: dex-api/Dockerfile
    environment:
      DATABASE_URL: postgres://dex:dexpass@db:5432/dex_os
      JWT_SECRET: change-me
      SERVER_PORT: 3030
      JWT_ISSUER: dex-os-api
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      - db
    ports:
      - "3030:3030"

  ui:
    build:
      context: .
      dockerfile: dex-ui/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pg-data:
