apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dex-api
  template:
    metadata:
      labels:
        app: dex-api
    spec:
      containers:
      - name: dex-api
        image: ghcr.io/your-org/dex-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3030
          name: http
        envFrom:
        - configMapRef:
            name: dex-api-config
        - secretRef:
            name: dex-api-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
