apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dex-ui
  template:
    metadata:
      labels:
        app: dex-ui
    spec:
      containers:
      - name: dex-ui
        image: ghcr.io/your-org/dex-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
