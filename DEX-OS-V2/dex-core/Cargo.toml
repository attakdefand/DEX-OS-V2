[package]
name = "dex-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "1.0"
sha2 = "0.10"
sha3 = "0.10"
regex = "1.0"
csv = "1.3"
once_cell = "1.19"
tokio = { workspace = true }
secp256k1 = { version = "0.28", features = ["rand-std", "recovery"] }
hex = "0.4"
# Cryptographic libraries for security features
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
fastrand = "2.0"
zeroize = "1.6"
clap = { version = "4.5", features = ["derive"] }
# Encryption libraries for data security
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.21"
uuid = { version = "1.4", features = ["v4", "fast-rng"] }
bincode = "1.3"
parking_lot = "0.12"
# HTTP client for RAMP integration
reqwest = { version = "0.11", features = ["json"] }

tokio-test = "0.4"

[dev-dependencies]
tempfile = "3"