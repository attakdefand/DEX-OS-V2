[package]
name = "bloom_filter_access_control"
version = "0.1.0"
edition = "2021"

[dependencies]
sha3 = "0.10"
dex-core = { path = "./dex-core" }
dex-db = { path = "./dex-db" }
dex-api = { path = "./dex-api" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "tls-rustls"] }
warp = "0.3"
serde_json = "1.0"
jsonwebtoken = "9"
tokio = { version = "1.0", features = ["full"] }
secrecy = "0.8"

[lib]
name = "bloom_filter_access_control"
path = "src/lib.rs"

[workspace]
members = [
    "dex-core",
    "dex-wasm",
    "dex-db",
    "dex-api",
    "run_security_tests",
    "global_identity_tests",
    "reference-tools",
    "run_certificate_security_tests",
    "test_coverage_demo",
    "bloom_filter_test_coverage_demo", 
    "dex-api-minimal",
    "security_tests_runner",
    "examples",
    "tests",
    "standalone_bloom_test",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.4"